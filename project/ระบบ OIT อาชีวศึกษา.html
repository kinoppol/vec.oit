  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1c632dce-5af7-4da2-9b2c-9c2895f7be89\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c0c430da-43fb-411a-9e4e-456b398b8f20\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\n@keyframes oitFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}\n::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}\ninput:focus,textarea:focus,select:focus{outline:none;border-color:var(--maroon)!important}\na{color:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ rootRef }}\" style=\"--bg:#F4F1ED;--surface:#FFFFFF;--surface-2:#FAF7F3;--surface-3:#EFE9E3;--border:#E7E0D9;--border-strong:#D6CBC2;--text:#221C18;--text-muted:#6E645C;--text-faint:#9E938A;--maroon:#7A1E28;--maroon-deep:#5C141C;--maroon-bright:#93242F;--maroon-soft:#F3E5E3;--gold:#B8893B;--success:#2F7A57;--success-soft:#E5F0EA;--warning:#A8701A;--warning-soft:#F5ECD7;--danger:#B23A3A;--danger-soft:#F6E3E1;--shadow:rgba(74,30,24,0.10);--on-maroon:#FFFFFF;font-family:'Sarabun',-apple-system,sans-serif;min-height:100vh;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5\">\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 22px;border-radius:11px;font-size:14px;font-weight:600;z-index:2000;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:oitFade .2s ease\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ LOGIN ============ -->\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;min-height:100vh\">\n  <div style=\"flex:0 0 42%;max-width:520px;background:linear-gradient(160deg,var(--maroon-deep),var(--maroon) 70%,#3d0d13);color:#fff;padding:48px 46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden\">\n    <div style=\"position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.08);right:-160px;top:-120px\"><\u002Fdiv>\n    <div style=\"position:absolute;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.06);right:-60px;top:-40px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;position:relative\">\n      <div style=\"width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.2)\"><img src=\"64e13a08-3170-4777-b187-1619094390ba\" style=\"width:100%;height:100%;object-fit:contain\"><\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.35;opacity:.92\">สำนักงานคณะกรรมการ<br>การอาชีวศึกษา<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative\">\n      <div style=\"font-size:13px;letter-spacing:3px;opacity:.7;font-weight:600\">OIT · OPEN DATA INTEGRITY<\u002Fdiv>\n      <h1 style=\"font-size:34px;font-weight:800;line-height:1.2;margin:14px 0 16px\">ระบบเปิดเผย<br>ข้อมูลสาธารณะ<\u002Fh1>\n      <p style=\"font-size:15px;opacity:.85;line-height:1.6;margin:0 0 26px;max-width:340px\">แพลตฟอร์มกลางสำหรับสถานศึกษาอาชีวศึกษา จัดเก็บหลักฐานตัวชี้วัด OIT และเผยแพร่ต่อสาธารณะ เพื่อการประเมินคุณธรรมและความโปร่งใส (ITA)<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14px;opacity:.9\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--gold)\"><\u002Fspan>แนบลิงก์ ไฟล์ รูปภาพ และข้อความเป็นหลักฐาน<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--gold)\"><\u002Fspan>รองรับการเปลี่ยนเกณฑ์ในแต่ละปีงบประมาณ<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--gold)\"><\u002Fspan>เชื่อมโยงหน้าแสดงผลกับเว็บไซต์สถานศึกษา<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;font-size:12px;opacity:.6\">© 2569 สำนักงานคณะกรรมการการอาชีวศึกษา กระทรวงศึกษาธิการ<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:40px\">\n    <div style=\"width:100%;max-width:392px\">\n      <div style=\"font-size:13px;color:var(--text-faint);font-weight:600;letter-spacing:.5px\">{{ systemName }}<\u002Fdiv>\n      <h2 style=\"font-size:27px;font-weight:800;margin:6px 0 4px;color:var(--text)\">เข้าสู่ระบบ<\u002Fh2>\n      <p style=\"margin:0 0 26px;color:var(--text-muted);font-size:14px\">สำหรับเจ้าหน้าที่และผู้ดูแลระบบของสถานศึกษา<\u002Fp>\n      <label style=\"display:block;font-size:13.5px;font-weight:600;margin-bottom:7px\">เลขประจำตัวประชาชน (ชื่อผู้ใช้)<\u002Flabel>\n      <input value=\"{{ liCid }}\" oninput=\"{{ onLiCid }}\" inputmode=\"numeric\" maxlength=\"13\" placeholder=\"กรอกเลข 13 หลัก\" style=\"width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--text);margin-bottom:16px\">\n      <label style=\"display:block;font-size:13.5px;font-weight:600;margin-bottom:7px\">รหัสผ่าน<\u002Flabel>\n      <input value=\"{{ liPw }}\" oninput=\"{{ onLiPw }}\" type=\"password\" placeholder=\"รหัสผ่าน\" style=\"width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--text)\">\n      <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--danger);font-size:13px;margin-top:9px\">{{ loginError }}<\u002Fdiv><\u002Fsc-if>\n      <button onclick=\"{{ doLogin }}\" style=\"width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:var(--maroon);color:var(--on-maroon);font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer\">เข้าสู่ระบบ<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--text-faint);font-size:12.5px\"><div style=\"flex:1;height:1px;background:var(--border)\"><\u002Fdiv>เข้าชมแบบสาธิตตามบทบาท<div style=\"flex:1;height:1px;background:var(--border)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n        <button onclick=\"{{ demoUser }}\" style=\"padding:10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer\">ผู้กรอกข้อมูล<\u002Fbutton>\n        <button onclick=\"{{ demoSchoolAdmin }}\" style=\"padding:10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer\">ผู้ดูแลสถานศึกษา<\u002Fbutton>\n        <button onclick=\"{{ demoCentral }}\" style=\"padding:10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer\">ผู้ดูแลส่วนกลาง<\u002Fbutton>\n        <button onclick=\"{{ openPublic }}\" style=\"padding:10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer\">มุมมองสาธารณะ<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:12.5px;color:var(--text-muted);line-height:1.55\">ชื่อผู้ใช้คือ <b style=\"color:var(--text)\">เลขประจำตัวประชาชน<\u002Fb> · รหัสผ่านเริ่มต้นระบบจะสุ่มให้โดยอัตโนมัติ และต้องเปลี่ยนเมื่อเข้าใช้งานครั้งแรก<\u002Fdiv>\n      <div style=\"text-align:center;margin-top:18px;font-size:13.5px;color:var(--text-muted)\">สถานศึกษายังไม่มีบัญชี? <span onclick=\"{{ openRegister }}\" style=\"color:var(--maroon);font-weight:700;cursor:pointer\">สมัครใช้งานระบบ<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ REGISTER ============ -->\n<sc-if value=\"{{ isRegister }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px\">\n  <div style=\"width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px var(--shadow);padding:38px 40px\">\n    <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:8px\"><div style=\"width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none\"><img src=\"64e13a08-3170-4777-b187-1619094390ba\" style=\"width:100%;height:100%;object-fit:contain\"><\u002Fdiv><div><div style=\"font-size:12.5px;color:var(--text-faint);font-weight:600\">สมัครใช้งานระบบ OIT<\u002Fdiv><h2 style=\"font-size:22px;font-weight:800;margin:2px 0\">ลงทะเบียนสถานศึกษา<\u002Fh2><\u002Fdiv><\u002Fdiv>\n    <sc-if value=\"{{ regNotDone }}\" hint-placeholder-val=\"{{ true }}\">\n    <p style=\"color:var(--text-muted);font-size:14px;margin:6px 0 22px\">กรอกข้อมูลเพื่อสมัครใช้งาน เมื่อผู้ดูแลส่วนกลางอนุมัติแล้ว บัญชีผู้ดูแลระบบสถานศึกษาจะถูกสร้างให้โดยอัตโนมัติ<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:15px\">\n      <div><label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">ชื่อสถานศึกษา<\u002Flabel><input value=\"{{ regSchool }}\" oninput=\"{{ onRegSchool }}\" placeholder=\"เช่น วิทยาลัยเทคนิค...\" style=\"width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--surface);color:var(--text)\"><\u002Fdiv>\n      <div><label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">จังหวัด<\u002Flabel><input value=\"{{ regProvince }}\" oninput=\"{{ onRegProvince }}\" placeholder=\"จังหวัด\" style=\"width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--surface);color:var(--text)\"><\u002Fdiv>\n      <div><label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">ชื่อ-นามสกุล ผู้ดูแลระบบสถานศึกษา<\u002Flabel><input value=\"{{ regAdmin }}\" oninput=\"{{ onRegAdmin }}\" placeholder=\"ชื่อ-นามสกุล\" style=\"width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--surface);color:var(--text)\"><\u002Fdiv>\n      <div style=\"display:flex;gap:13px\">\n        <div style=\"flex:1\"><label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">เลขประจำตัวประชาชน<\u002Flabel><input value=\"{{ regCid }}\" oninput=\"{{ onRegCid }}\" inputmode=\"numeric\" maxlength=\"13\" placeholder=\"13 หลัก\" style=\"width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--surface);color:var(--text)\"><\u002Fdiv>\n        <div style=\"flex:1\"><label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:6px\">อีเมล<\u002Flabel><input value=\"{{ regEmail }}\" oninput=\"{{ onRegEmail }}\" placeholder=\"อีเมลติดต่อ\" style=\"width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:9px;font-family:inherit;font-size:14.5px;background:var(--surface);color:var(--text)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:11px;margin-top:24px\">\n      <button onclick=\"{{ backToLogin }}\" style=\"padding:12px 20px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer\">ย้อนกลับ<\u002Fbutton>\n      <button onclick=\"{{ doRegister }}\" style=\"flex:1;padding:12px;border:none;border-radius:10px;background:var(--maroon);color:var(--on-maroon);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer\">ส่งคำขอสมัครใช้งาน<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ regDoneFlag }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"text-align:center;padding:14px 0 6px\">\n      <div style=\"width:62px;height:62px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px\">✓<\u002Fdiv>\n      <h3 style=\"font-size:20px;font-weight:800;margin:0 0 6px\">ส่งคำขอเรียบร้อยแล้ว<\u002Fh3>\n      <p style=\"color:var(--text-muted);font-size:14px;margin:0 0 20px;line-height:1.6\">คำขอของ <b style=\"color:var(--text)\">{{ regDoneSchool }}<\u002Fb> อยู่ระหว่างรอผู้ดูแลส่วนกลางอนุมัติ<br>นี่คือข้อมูลบัญชีผู้ดูแลระบบสถานศึกษาเบื้องต้น<\u002Fp>\n      <div style=\"background:var(--surface-2);border:1px dashed var(--maroon);border-radius:12px;padding:18px;text-align:left;max-width:320px;margin:0 auto\">\n        <div style=\"font-size:12px;color:var(--text-muted)\">ชื่อผู้ใช้ (เลขประจำตัวประชาชน)<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:700;font-family:monospace;margin:2px 0 12px\">{{ regDoneCid }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-muted)\">รหัสผ่านเริ่มต้น (สุ่มอัตโนมัติ)<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:700;font-family:monospace;color:var(--maroon)\">{{ regDonePw }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ backToLogin }}\" style=\"margin-top:22px;padding:11px 26px;border:none;border-radius:10px;background:var(--maroon);color:var(--on-maroon);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer\">กลับสู่หน้าเข้าสู่ระบบ<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ FIRST LOGIN ============ -->\n<sc-if value=\"{{ isFirstLogin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px\">\n  <div style=\"width:100%;max-width:430px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px var(--shadow);padding:38px 38px\">\n    <div style=\"width:52px;height:52px;border-radius:14px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;margin-bottom:16px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <h2 style=\"font-size:22px;font-weight:800;margin:0 0 6px\">ตั้งรหัสผ่านใหม่<\u002Fh2>\n    <p style=\"color:var(--text-muted);font-size:14px;margin:0 0 24px;line-height:1.6\">เพื่อความปลอดภัย กรุณาเปลี่ยนรหัสผ่านที่ระบบสุ่มให้ ก่อนเริ่มใช้งานครั้งแรก<\u002Fp>\n    <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px\">รหัสผ่านใหม่<\u002Flabel>\n    <input value=\"{{ np1 }}\" oninput=\"{{ onNp1 }}\" type=\"password\" placeholder=\"อย่างน้อย 8 ตัวอักษร\" style=\"width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--text);margin-bottom:15px\">\n    <label style=\"display:block;font-size:13px;font-weight:600;margin-bottom:7px\">ยืนยันรหัสผ่านใหม่<\u002Flabel>\n    <input value=\"{{ np2 }}\" oninput=\"{{ onNp2 }}\" type=\"password\" placeholder=\"กรอกอีกครั้ง\" style=\"width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--text)\">\n    <sc-if value=\"{{ pwError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:var(--danger);font-size:13px;margin-top:10px\">{{ pwError }}<\u002Fdiv><\u002Fsc-if>\n    <button onclick=\"{{ doSetPassword }}\" style=\"width:100%;margin-top:22px;padding:13px;border:none;border-radius:10px;background:var(--maroon);color:var(--on-maroon);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer\">บันทึกและเข้าสู่ระบบ<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ APP SHELL ============ -->\n<sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;min-height:100vh\">\n  <!-- sidebar -->\n  <aside style=\"flex:0 0 264px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh\">\n    <div style=\"padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px\">\n      <div style=\"width:42px;height:42px;border-radius:11px;overflow:hidden;flex:none;border:1px solid var(--border)\"><img ref=\"{{ logoRef }}\" alt=\"ตราสถานศึกษา\" style=\"width:100%;height:100%;object-fit:contain;background:#fff\"><\u002Fdiv>\n      <div style=\"min-width:0\"><div style=\"fo \">{{ pev.label }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ prow.noEv }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12.5px;color:var(--text-faint)\">—<\u002Fspan><\u002Fsc-if>\n                  <\u002Ftd>\n                <\u002Ftr>\n              \n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-for>\n    <div style=\"margin-top:32px;text-align:center;font-size:12px;color:var(--text-faint)\">เผยแพร่ผ่านระบบเปิดเผยข้อมูลสาธารณะ (OIT) · สำนักงานคณะกรรมการการอาชีวศึกษา<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showDemoSwitcher&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;systemName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ระบบเปิดเผยข้อมูลสาธารณะ (OIT)&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.rootRef = (el)=>{ this._root = el; if(el) this.applyTheme(); };\n    this._logoEls = [];\n    this.logoRef = (el)=>{ if(el){ this._logoEls.push(el); el.src = this.computeLogo(); } };\n    this.state = this.initState();\n  }\n\n  initState(){\n    let saved=null;\n    try{ saved=JSON.parse(localStorage.getItem('oit_state_v3')||'null'); }catch(e){}\n    const dflTheme=(this.props&&this.props.defaultTheme)||'system';\n    return {\n      screen:'login', view:'dashboard', role:'user', publicFrom:'login',\n      theme:(saved&&saved.theme)||dflTheme,\n      years:(saved&&saved.years)||[{id:'2568',label:'ปีงบประมาณ พ.ศ. 2568',active:true},{id:'2567',label:'ปีงบประมาณ พ.ศ. 2567',active:false}],\n      activeYear:(saved&&saved.activeYear)||'2568',\n      dataByYear:(saved&&saved.dataByYear)||this.defaultData(),\n      users:(saved&&saved.users)||this.defaultUsers(),\n      school:(saved&&saved.school)||{name:'วิทยาลัยเทคนิคนครหลวง',province:'กรุงเทพมหานคร',slug:'nakhonluang',emblem:null},\n      registrations:(saved&&saved.registrations)||this.defaultRegs(),\n      currentUserName:'', currentUserInitial:'', selectedCode:null,\n      liCid:'', liPw:'', loginError:'',\n      regSchool:'', regProvince:'', regAdmin:'', regCid:'', regEmail:'', regDone:null,\n      np1:'', np2:'', pwError:'',\n      evType:'link', evTitle:'', evUrl:'', evNote:'', evFileName:'', evImgSrc:'',\n      auName:'', auCid:'', auRole:'user', userError:'', newCred:null,\n      edTitle:'', edCriteria:'',\n      nyLabel:'', nyClone:'2568',\n      toast:null\n    };\n  }\n\n  componentDidMount(){\n    this._mq=window.matchMedia('(prefers-color-scheme: dark)');\n    this._mqh=()=>{ if(this.state.theme==='system') this.applyTheme(); };\n    this._mq.addEventListener('change',this._mqh);\n    this.applyTheme();\n  }\n  componentWillUnmount(){ if(this._mq) this._mq.removeEventListener('change',this._mqh); }\n  computeLogo(){ return (this.state.school&&this.state.school.emblem)||(window.__resources&&window.__resources.ovecLogo)||'assets/ovec-logo.jpg'; }\n  componentDidUpdate(){ const l=this.computeLogo(); this._logoEls=this._logoEls.filter(e=>e&&e.isConnected); this._logoEls.forEach(e=>{ if(e.getAttribute('src')!==l) e.src=l; }); }\n\n  themeVars(dark){\n    return dark ? {\n      '--bg':'#15100E','--surface':'#1E1714','--surface-2':'#251D19','--surface-3':'#2F2520',\n      '--border':'#3A2F2A','--border-strong':'#4C3E37','--text':'#F1E9E3','--text-muted':'#B2A69E','--text-faint':'#80746C',\n      '--maroon':'#C8505E','--maroon-deep':'#8E2230','--maroon-bright':'#DA6B76','--maroon-soft':'#2E1A1B',\n      '--gold':'#D2A656','--success':'#54A77E','--success-soft':'#1E2C25','--warning':'#D2982F','--warning-soft':'#2E2618',\n      '--danger':'#D96666','--danger-soft':'#2F1C1B','--shadow':'rgba(0,0,0,0.45)','--on-maroon':'#FFFFFF'\n    } : {\n      '--bg':'#F4F1ED','--surface':'#FFFFFF','--surface-2':'#FAF7F3','--surface-3':'#EFE9E3',\n      '--border':'#E7E0D9','--border-strong':'#D6CBC2','--text':'#221C18','--text-muted':'#6E645C','--text-faint':'#9E938A',\n      '--maroon':'#7A1E28','--maroon-deep':'#5C141C','--maroon-bright':'#93242F','--maroon-soft':'#F3E5E3',\n      '--gold':'#B8893B','--success':'#2F7A57','--success-soft':'#E5F0EA','--warning':'#A8701A','--warning-soft':'#F5ECD7',\n      '--danger':'#B23A3A','--danger-soft':'#F6E3E1','--shadow':'rgba(74,30,24,0.10)','--on-maroon':'#FFFFFF'\n    };\n  }\n  applyTheme(){\n    if(!this._root) return;\n    let dark;\n    if(this.state.theme==='dark') dark=true;\n    else if(this.state.theme==='light') dark=false;\n    else dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;\n    const v=this.themeVars(dark);\n    for(const k in v) this._root.style.setProperty(k,v[k]);\n  }\n  setTheme(mode){ this.setState({theme:mode},()=>{ this.applyTheme(); this.persist(); }); }\n\n  persist(){\n    try{\n      const s=this.state;\n      localStorage.setItem('oit_state_v3',JSON.stringify({theme:s.theme,years:s.years,activeYear:s.activeYear,dataByYear:s.dataByYear,users:s.users,school:s.school,registrations:s.registrations}));\n    }catch(e){}\n  }\n  toast(msg){ this.setState({toast:msg}); clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:null}),2200); }\n  genPwd(){ const c='ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<8;i++) s+=c[Math.floor(Math.random()*c.length)]; return s+'#'+Math.floor(Math.random()*90+10); }\n\n  buildSections(){\n    const mk=(code,title,criteria)=>({code,title,criteria,status:'pending',evidences:[]});\n    return [\n      {id:'9',title:'ส่วนที่ 1 · การเปิดเผยข้อมูล',short:'ตัวชี้วัดที่ 9',subs:[\n        {id:'9.1',title:'9.1 ข้อมูลพื้นฐาน',inds:[\n          mk('O1','โครงสร้างหน่วยงาน','แสดงแผนผังโครงสร้างการแบ่งส่วนราชการของสถานศึกษา'),\n          mk('O2','ข้อมูลผู้บริหาร','แสดงรายชื่อ ตำแหน่ง และภาพถ่ายผู้บริหารสถานศึกษา'),\n          mk('O3','อำนาจหน้าที่','แสดงข้อมูลหน้าที่และอำนาจของสถานศึกษาตามที่กฎหมายกำหนด'),\n          mk('O4','ข้อมูลการติดต่อ','แสดงที่อยู่ เบอร์โทรศัพท์ อีเมล และแผนที่ตั้งของสถานศึกษา'),\n          mk('O5','ข่าวประชาสัมพันธ์','แสดงข้อมูลข่าวสารที่เกี่ยวข้องกับการดำเนินงานในปีงบประมาณ'),\n          mk('O6','Q&A','แสดงช่องทางที่บุคคลภายนอกสามารถสอบถามข้อมูลและได้รับคำตอบ')\n        ]},\n        {id:'9.2',title:'9.2 การบริหารงานและการใช้จ่ายงบประมาณ',inds:[\n          mk('O7','แผนพัฒนาสถานศึกษา','แสดงแผนการดำเนินงานตามยุทธศาสตร์/แผนพัฒนาสถานศึกษา'),\n          mk('O8','แผนและความก้าวหน้าการดำเนินงานประจำปี','แสดงความก้าวหน้าการดำเนินงานตามแผนปฏิบัติราชการประจำปี'),\n          mk('O9','รายงานผลการดำเนินงานประจำปี','แสดงผลการดำเนินงานตามแผนปฏิบัติราชการประจำปีที่ผ่านมา'),\n          mk('O10','คู่มือหรือแนวทางการปฏิบัติงาน','แสดงคู่มือหรือแนวทางการปฏิบัติงานของบุคลากร'),\n          mk('O11','คู่มือหรือแนวทางการให้บริการ','แสดงคู่มือการให้บริการสำหรับผู้รับบริการหรือผู้มาติดต่อ'),\n          mk('O12','ข้อมูลสถิติการให้บริการ','แสดงข้อมูลสถิติการให้บริการตามภารกิจของสถานศึกษา'),\n          mk('O13','รายงานการกำกับติดตามการใช้จ่ายงบประมาณประจำปี','แสดงผลการใช้จ่ายงบประมาณรายไตรมาส')\n        ]},\n        {id:'9.3',title:'9.3 การจัดซื้อจัดจ้าง',inds:[\n          mk('O14','แผนการจัดซื้อจัดจ้างหรือแผนการจัดหาพัสดุ','แสดงแผนการจัดซื้อจัดจ้างประจำปี'),\n          mk('O15','ประกาศต่าง ๆ เกี่ยวกับการจัดซื้อจัดจ้าง','แสดงประกาศจัดซื้อจัดจ้างตามที่หน่วยงานต้องดำเนินการ'),\n          mk('O16','สรุปผลการจัดซื้อจัดจ้างรายเดือน','แสดงสรุปผลการจัดซื้อจัดจ้าง (แบบ สขร.1) รายเดือน'),\n          mk('O17','รายงานผลการจัดซื้อจัดจ้างประจำปี','แสดงผลการจัดซื้อจัดจ้างและการวิเคราะห์ผลประจำปี')\n        ]},\n        {id:'9.4',title:'9.4 การบริหารและพัฒนาทรัพยากรบุคคล',inds:[\n          mk('O18','นโยบายการบริหารทรัพยากรบุคคล','แสดงนโยบายการบริหารและพัฒนาทรัพยากรบุคคล'),\n          mk('O19','หลักเกณฑ์การบริหารและพัฒนาทรัพยากรบุคคล','แสดงหลักเกณฑ์การสรรหา บรรจุ แต่งตั้ง พัฒนา ประเมินผล'),\n          mk('O20','รายงานผลการบริหารและพัฒนาทรัพยากรบุคคลประจำปี','แสดงผลการบริหารและพัฒนาทรัพยากรบุคคลที่ผ่านมา')\n        ]},\n        {id:'9.5',title:'9.5 การส่งเสริมความโปร่งใส',inds:[\n          mk('O21','แนวปฏิบัติการจัดการเรื่องร้องเรียนการทุจริต','แสดงแนวปฏิบัติการจัดการเรื่องร้องเรียนและประพฤติมิชอบ'),\n          mk('O22','ช่องทางแจ้งเรื่องร้องเรียนการทุจริต','แสดงช่องทางออนไลน์สำหรับแจ้งเรื่องร้องเรียน'),\n          mk('O23','ข้อมูลเชิงสถิติเรื่องร้องเรียนการทุจริตประจำปี','แสดงข้อมูลสถิติเรื่องร้องเรียนการทุจริตและประพฤติมิชอบ'),\n          mk('O24','การเปิดโอกาสให้มีส่วนร่วม','แสดงการเปิดโอกาสให้ผู้มีส่วนได้ส่วนเสียมีส่วนร่วม')\n        ]}\n      ]},\n      {id:'10',title:'ส่วนที่ 2 · การป้องกันการทุจริต',short:'ตัวชี้วัดที่ 10',subs:[\n        {id:'10.1',title:'10.1 นโยบาย No Gift Policy',inds:[\n          mk('O25','ประกาศเจตนารมณ์นโยบาย No Gift Policy','แสดงประกาศเจตนารมณ์ไม่รับของขวัญและของกำนัล'),\n          mk('O26','การสร้างวัฒนธรรม No Gift Policy','แสดงการดำเนินกิจกรรมเสริมสร้างวัฒนธรรมองค์กร'),\n          mk('O27','รายงานผลตามนโยบาย No Gift Policy','แสดงผลการดำเนินการตามนโยบายในรอบปี'),\n          mk('O28','การประเมินความเสี่ยงการทุจริต','แสดงผลการประเมินความเสี่ยงการทุจริตในประเด็นที่เกี่ยวข้อง'),\n          mk('O29','รายงานผลการดำเนินการเพื่อจัดการความเสี่ยงการทุจริต','แสดงผลการดำเนินการตามมาตรการจัดการความเสี่ยง')\n        ]},\n        {id:'10.2',title:'10.2 มาตรการส่งเสริมคุณธรรมและความโปร่งใส',inds:[\n          mk('O30','แผนปฏิบัติการป้องกันการทุจริต','แสดงแผนปฏิบัติการป้องกันการทุจริตประจำปี'),\n          mk('O31','รายงานผลการดำเนินการป้องกันการทุจริตประจำปี','แสดงผลการดำเนินงานตามแผนป้องกันการทุจริต'),\n          mk('O32','มาตรการส่งเสริมคุณธรรมและความโปร่งใสภายในสถานศึกษา','แสดงการวิเคราะห์ผลการประเมินและมาตรการที่กำหนด'),\n          mk('O33','การดำเนินการตามมาตรการส่งเสริมคุณธรรมและความโปร่งใส','แสดงผลการดำเนินการตามมาตรการที่กำหนด')\n        ]}\n      ]}\n    ];\n  }\n  eachInd(sections,fn){ sections.forEach(se=>se.subs.forEach(su=>su.inds.forEach(fn))); }\n  findInd(sections,code){ let r=null; this.eachInd(sections,i=>{ if(i.code===code) r=i; }); return r; }\n  defaultData(){\n    const base=this.buildSections();\n    const y68=JSON.parse(JSON.stringify(base)); this.seed68(y68);\n    const y67=JSON.parse(JSON.stringify(base)); this.eachInd(y67,i=>{ i.status='done'; i.evidences=[{id:i.code+'-0',type:'link',title:'หลักฐานปีงบประมาณ 2567',url:'https://www.nakhonluang.ac.th/oit/2567/'+i.code}]; });\n    return {'2568':y68,'2567':y67};\n  }\n  seed68(s){\n    const set=(code,status,evs)=>{ const ind=this.findInd(s,code); if(!ind) return; ind.status=status; ind.evidences=(evs||[]).map((e,i)=>Object.assign({id:code+'-'+i},e)); };\n    const L='https://www.nakhonluang.ac.th/oit/';\n    set('O1','done',[{type:'link',title:'แผนผังโครงสร้างการบริหารงาน',url:L+'structure'}]);\n    set('O2','done',[{type:'link',title:'ทำเนียบผู้บริหาร',url:L+'executives'},{type:'image',title:'ภาพผู้อำนวยการสถานศึกษา'}]);\n    set('O3','done',[{type:'link',title:'อำนาจหน้าที่ตามกฎหมาย',url:L+'authority'}]);\n    set('O4','done',[{type:'link',title:'ที่ตั้งและช่องทางติดต่อ',url:L+'contact'},{type:'text',title:'ที่อยู่สถานศึกษา',note:'เลขที่ 199 ถ.เจ้าฟ้า แขวงพระบรมมหาราชวัง เขตพระนคร กรุงเทพฯ 10200 โทร 0-2222-xxxx'}]);\n    set('O5','inprogress',[{type:'link',title:'ข่าวประชาสัมพันธ์ปี 2568',url:L+'news'}]);\n    set('O6','done',[{type:'link',title:'กระดานถาม-ตอบ (Q&A)',url:L+'qa'}]);\n    set('O7','done',[{type:'file',title:'แผนพัฒนาสถานศึกษา 2566-2570.pdf',fileName:'แผนพัฒนาสถานศึกษา.pdf',url:L+'plan.p ,currentUserInitial:name.replace(/^(นาย|นาง|นางสาว)/,'').trim()[0]||'อ',loginError:''}); }\n    else { this.enterApp(role,name); }\n  }\n  enterApp(role,name){ this.setState({screen:'app',role,currentUserName:name,currentUserInitial:name.replace(/^(นาย|นาง|นางสาว)/,'').trim()[0]||'อ',view:role==='centraladmin'?'criteria':'dashboard',loginError:'',selectedCode:null}); }\n  demoLogin(role){ const map={user:'นางสาวสุดา รักเรียน',schooladmin:'นายสมชาย ใจดี',centraladmin:'ผู้ดูแลส่วนกลาง สอศ.'}; this.enterApp(role,map[role]); }\n  openRegister(){ this.setState({screen:'register',regDone:null}); }\n  backToLogin(){ this.setState({screen:'login',regDone:null}); }\n  doRegister(){\n    const st=this.state;\n    if(!st.regSchool.trim()||!st.regAdmin.trim()){ this.toast('กรุณากรอกข้อมูลให้ครบ'); return; }\n    if(!/^\\d{13}$/.test(st.regCid.trim())){ this.toast('เลขประจำตัวประชาชนต้องมี 13 หลัก'); return; }\n    const pw=this.genPwd();\n    const regs=[{name:st.regSchool.trim(),province:st.regProvince.trim()||'-',adminName:st.regAdmin.trim(),cid:st.regCid.trim(),status:'pending',date:'วันนี้'}].concat(st.registrations);\n    this.setState({registrations:regs,regDone:{cid:st.regCid.trim(),pw,school:st.regSchool.trim()},regSchool:'',regProvince:'',regAdmin:'',regCid:'',regEmail:''},this.persist.bind(this));\n  }\n  doSetPassword(){\n    const {np1,np2}=this.state;\n    if(np1.length<8){ this.setState({pwError:'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'}); return; }\n    if(np1!==np2){ this.setState({pwError:'รหัสผ่านยืนยันไม่ตรงกัน'}); return; }\n    const users=this.state.users.map(u=>u.name===this.state.currentUserName?Object.assign({},u,{mustChange:false,status:'active'}):u);\n    this.setState({users,np1:'',np2:'',pwError:''},()=>{ this.persist(); this.enterApp(this.state.role,this.state.currentUserName); this.toast('ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว'); });\n  }\n\n  // evidence\n  setEvType(t){ this.setState({evType:t}); }\n  onPickFile(e){ const f=e.target.files[0]; if(!f) return; t
