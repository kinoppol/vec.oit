; PHP limits for evidence uploads (PHP-FPM / CGI reads this per-directory file).
; The app advertises 10 MB per file and allows selecting several files at once,
; so post_max_size must cover the sum of a whole batch, not one file.
; Changes can take up to user_ini.cache_ttl (default 300s) to apply.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 40
